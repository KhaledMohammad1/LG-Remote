                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          w("app/src/main/java/com/example/lgremote/model/TvModels.kt", """
          package com.example.lgremote.model

          data class TvApp(
              val id: String,
              val title: String
          )

          enum class ConnectionState {
              DISCONNECTED,
              CONNECTING,
              WAITING_FOR_PAIRING,
              CONNECTED,
