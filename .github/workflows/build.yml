          @Composable
          fun TouchpadScreen(client: WebOsClient) {
              val view = LocalView.current
              var sensitivity by remember { mutableFloatStateOf(1.8f) }

              Column(modifier = Modifier.fillMaxSize().padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Button(onClick = { client.sendPointerButton("BACK") }) { Text("رجوع") }
                      Button(onClick = { client.sendPointerButton("HOME") }) { Text("القائمة Home") }
                  }
                  Spacer(modifier = Modifier.height(12.dp))
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                          .clip(RoundedCornerShape(24.dp))
                          .background(SurfaceDark)
                          .border(2.dp, CardBackground, RoundedCornerShape(24.dp))
                          .pointerInput(Unit) {
                              detectTapGestures(onTap = {
                                  view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_PRESS)
                                  client.sendPointerClick()
                              })
                          }
                          .pointerInput(sensitivity) {
                              detectDragGestures(onDrag = { change, drag ->
                                  change.consume()
                                  client.sendPointerMove(drag.x * sensitivity, drag.y * sensitivity)
                              })
                          },
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          text = "حرّك إصبعك هنا لتحريك مؤشر الماوس على الشاشة\\nالمس مرة للضغط (Click)",
                          color = TextSecondary,
                          textAlign = TextAlign.Center
                      )
                      Box(
                          modifier = Modifier
                              .align(Alignment.CenterEnd)
                              .padding(end = 8.dp)
                              .width(44.dp)
                              .fillMaxHeight(0.7f)
                              .clip(RoundedCornerShape(12.dp))
                              .background(CardBackground)
                              .pointerInput(Unit) {
                                  detectDragGestures { change, drag ->
                                      change.consume()
                                      client.sendPointerScroll(if (drag.y > 0) -1 else 1)
                                  }
                              },
                          contentAlignment = Alignment.Center
                      ) {
                          Text("عجلة\\nتمرير", color = AccentCyan, fontSize = 10.sp, textAlign = TextAlign.Center)
                      }
                  }
                  Spacer(modifier = Modifier.height(12.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("السرعة:", color = TextSecondary, fontSize = 12.sp)
                      Slider(value = sensitivity, onValueChange = { sensitivity = it }, valueRange = 0.8f..3.5f)
                  }
              }
          }

          @Composable
          fun RemoteScreen(client: WebOsClient) {
              val isMuted by client.isMuted.collectAsState()
              Column(
                  modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Button(onClick = { client.turnOff() }, colors = ButtonDefaults.buttonColors(containerColor = LGRed)) {
                          Text("إيقاف التشغيل Power Off")
                      }
                      Button(onClick = { client.sendPointerButton("INPUT") }) {
                          Text("المداخل HDMI")
                      }
                  }

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Button(onClick = { client.volumeUp() }) { Text("VOL +") }
                          Text("الصوت", color = TextSecondary)
                          Button(onClick = { client.volumeDown() }) { Text("VOL -") }
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = { client.toggleMute(!isMuted) }) { Text(if (isMuted) "إلغاء الكتم" else "كتم Mute") }
                          Button(onClick = { client.sendPointerButton("HOME") }) { Text("الرئيسية Home") }
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Button(onClick = { client.channelUp() }) { Text("CH +") }
                          Text("القنوات", color = TextSecondary)
                          Button(onClick = { client.channelDown() }) { Text("CH -") }
                      }
                  }

                  // D-Pad
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Button(onClick = { client.sendPointerButton("UP") }) { Text("▲") }
                      Row(horizontalArrangement = Arrangement.spacedBy(16.dp), verticalAlignment = Alignment.CenterVertically) {
                          Button(onClick = { client.sendPointerButton("LEFT") }) { Text("◄") }
                          Button(onClick = { client.sendPointerButton("ENTER") }, colors = ButtonDefaults.buttonColors(containerColor = LGRed)) { Text("OK") }
                          Button(onClick = { client.sendPointerButton("RIGHT") }) { Text("►") }
                      }
                      Button(onClick = { client.sendPointerButton("DOWN") }) { Text("▼") }
                  }

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      Button(onClick = { client.sendPointerButton("BACK") }) { Text("رجوع") }
                      Button(onClick = { client.play() }) { Text("تشغيل ▶") }
                      Button(onClick = { client.pause() }) { Text("إيقاف ⏸") }
                      Button(onClick = { client.sendPointerButton("EXIT") }) { Text("خروج") }
                  }
              }
          }

          @Composable
          fun AppLauncherScreen(client: WebOsClient) {
              val apps by client.installedApps.collectAsState()
              val defaultApps = listOf(
                  TvApp("youtube.leanback.v4", "YouTube"),
                  TvApp("netflix", "Netflix"),
                  TvApp("shahid", "Shahid VIP"),
                  TvApp("com.webos.app.browser", "Web Browser"),
                  TvApp("com.webos.app.livetv", "Live TV"),
                  TvApp("com.webos.app.hdmi1", "HDMI 1"),
                  TvApp("com.webos.app.hdmi2", "HDMI 2"),
                  TvApp("amazon", "Prime Video")
              )
              val list = if (apps.isNotEmpty()) apps else defaultApps

              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Text("برامج الشاشة", color = TextPrimary, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Button(onClick = { client.fetchInstalledApps() }) { Text("تحديث") }
                  }
                  Spacer(modifier = Modifier.height(12.dp))
                  LazyVerticalGrid(
                      columns = GridCells.Fixed(2),
                      horizontalArrangement = Arrangement.spacedBy(10.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      items(list) { app ->
                          Card(
                              modifier = Modifier.fillMaxWidth().height(70.dp).clickable { client.launchApp(app.id) },
                              colors = CardDefaults.cardColors(containerColor = SurfaceDark)
                          ) {
                              Box(modifier = Modifier.fillMaxSize().padding(8.dp), contentAlignment = Alignment.Center) {
                                  Text(app.title, color = TextPrimary, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center)
                              }
                          }
                      }
                  }
              }
          }
