          w("app/src/main/java/com/example/lgremote/client/WakeOnLan.kt", """
          package com.example.lgremote.client

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress

          object WakeOnLan {
              suspend fun wake(macAddress: String, broadcastIp: String = "255.255.255.255", port: Int = 9) = withContext(Dispatchers.IO) {
                  try {
                      val cleanMac = macAddress.replace(":", "").replace("-", "").trim()
                      if (cleanMac.length != 12) return@withContext false
                      val macBytes = ByteArray(6)
                      for (i in 0 until 6) {
                          macBytes[i] = cleanMac.substring(i * 2, i * 2 + 2).toInt(16).toByte()
                      }
                      val bytes = ByteArray(6 + 16 * 6)
                      for (i in 0 until 6) bytes[i] = 0xFF.toByte()
                      var offset = 6
                      for (i in 0 until 16) {
                          System.arraycopy(macBytes, 0, bytes, offset, 6)
                          offset += 6
                      }
                      val address = InetAddress.getByName(broadcastIp)
                      val packet = DatagramPacket(bytes, bytes.size, address, port)
                      DatagramSocket().use { socket ->
                          socket.broadcast = true
                          socket.send(packet)
                      }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          """)

          w("app/src/main/java/com/example/lgremote/client/WebOsClient.kt", """
          package com.example.lgremote.client

          import android.content.Context
          import com.example.lgremote.model.ConnectionState
          import com.example.lgremote.model.TvApp
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import org.json.JSONArray
          import org.json.JSONObject
          import java.security.SecureRandom
          import java.security.cert.X509Certificate
          import java.util.concurrent.TimeUnit
          import javax.net.ssl.SSLContext
          import javax.net.ssl.TrustManager
          import javax.net.ssl.X509TrustManager

          class WebOsClient(private val context: Context) {
              private val PREFS_NAME = "LGRemotePrefs"
              private val KEY_CLIENT_KEY = "client_key"
              private val scope = CoroutineScope(Dispatchers.IO)

              private val _connectionState = MutableStateFlow(ConnectionState.DISCONNECTED)
              val connectionState: StateFlow<ConnectionState> = _connectionState.asStateFlow()

              private val _isMuted = MutableStateFlow(false)
              val isMuted: StateFlow<Boolean> = _isMuted.asStateFlow()

              private val _installedApps = MutableStateFlow<List<TvApp>>(emptyList())
              val installedApps: StateFlow<List<TvApp>> = _installedApps.asStateFlow()

              private var mainWebSocket: WebSocket? = null
              private var pointerWebSocket: WebSocket? = null
              private var tvIp: String = ""

              private val okHttpClient: OkHttpClient by lazy { createUnsafeOkHttpClient() }

              private fun getSavedClientKey(): String? =
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getString(KEY_CLIENT_KEY, null)

              private fun saveClientKey(key: String) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putString(KEY_CLIENT_KEY, key).apply()
              }

              fun connect(ip: String) {
                  tvIp = ip.trim()
                  disconnect()
                  _connectionState.value = ConnectionState.CONNECTING
                  scope.launch {
                      val req = Request.Builder().url("wss://$tvIp:3001").build()
                      mainWebSocket = okHttpClient.newWebSocket(req, object : WebSocketListener() {
                          override fun onOpen(webSocket: WebSocket, response: Response) = sendRegistration(webSocket)
                          override fun onMessage(webSocket: WebSocket, text: String) = handleMainSocketMessage(text)
                          override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) = connectWsFallback()
                          override fun onClosed(webSocket: WebSocket, code: Int, reason: String) {
                              _connectionState.value = ConnectionState.DISCONNECTED
                          }
                      })
                  }
              }

              private fun connectWsFallback() {
                  val req = Request.Builder().url("ws://$tvIp:3000").build()
                  mainWebSocket = okHttpClient.newWebSocket(req, object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: Response) = sendRegistration(webSocket)
                      override fun onMessage(webSocket: WebSocket, text: String) = handleMainSocketMessage(text)
                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) {
                          _connectionState.value = ConnectionState.ERROR
                      }
                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) {
                          _connectionState.value = ConnectionState.DISCONNECTED
                      }
                  })
              }

              private fun sendRegistration(ws: WebSocket) {
                  val clientKey = getSavedClientKey()
                  val regJson = JSONObject().apply {
                      put("id", "register_0")
                      put("type", "register")
                      put("payload", JSONObject().apply {
                          put("forcePairing", false)
                          put("pairingType", "PROMPT")
                          if (!clientKey.isNullOrEmpty()) put("client-key", clientKey)
                          put("manifest", JSONObject().apply {
                              put("manifestVersion", 1)
                              put("appVersion", "1.0")
                              put("signed", JSONObject().apply {
                                  put("created", "20240101")
                                  put("appId", "com.example.lgremote")
                                  put("vendorId", "com.example")
                                  put("localizedAppNames", JSONObject().apply {
                                      put("", "LG Magic Remote")
                                      put("ar", "ريموت إل جي الذكي")
                                  })
                                  put("permissions", JSONArray(listOf(
                                      "LAUNCH", "LAUNCH_WEBAPP", "APP_TO_APP", "CLOSE",
                                      "CONTROL_AUDIO", "CONTROL_INPUT_TV", "CONTROL_POWER",
                                      "READ_INSTALLED_APPS", "READ_CURRENT_CHANNEL", "READ_RUNNING_APPS",
                                      "WRITE_NOTIFICATION_TOAST"
                                  )))
                              })
                              put("permissions", JSONArray(listOf(
                                  "LAUNCH", "CONTROL_AUDIO", "CONTROL_INPUT_TV", "READ_INSTALLED_APPS", "CONTROL_POWER"
                              )))
                          })
                      })
                  }
                  if (clientKey.isNullOrEmpty()) _connectionState.value = ConnectionState.WAITING_FOR_PAIRING
                  ws.send(regJson.toString())
              }

              private fun handleMainSocketMessage(text: String) {
                  try {
                      val json = JSONObject(text)
                      val type = json.optString("type")
                      val id = json.optString("id")
                      val payload = json.optJSONObject("payload")
                      when (type) {
                          "registered" -> {
                              val key = payload?.optString("client-key")
                              if (!key.isNullOrEmpty()) saveClientKey(key)
                              _connectionState.value = ConnectionState.CONNECTED
                              requestPointerSocket()
                              fetchInstalledApps()
                              showToast("تم اتصال ريموت Redmi A3 بنجاح")
                          }
                          "response" -> {
                              if (id == "req_pointer" && payload != null) {
                                  val path = payload.optString("socketPath")
                                  if (path.isNotEmpty()) connectPointerSocket(path)
                              } else if (id == "req_apps" && payload != null) {
                                  parseApps(payload)
                              }
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun requestPointerSocket() {
                  sendRequest("req_pointer", "ssap://com.webos.service.networkinput/getPointerInputSocket")
              }

              private fun connectPointerSocket(socketPath: String) {
                  val req = Request.Builder().url(socketPath).build()
                  pointerWebSocket = okHttpClient.newWebSocket(req, object : WebSocketListener() {})
              }

              fun sendPointerMove(dx: Float, dy: Float) {
                  pointerWebSocket?.send("type:move\\ndx:${dx.toInt()}\\ndy:${dy.toInt()}\\ndown:0\\n\\n")
              }

              fun sendPointerClick() {
                  pointerWebSocket?.send("type:click\\n\\n")
              }

              fun sendPointerScroll(dy: Int) {
                  pointerWebSocket?.send("type:scroll\\ndx:0\\ndy:$dy\\n\\n")
              }

              fun sendPointerButton(name: String) {
                  val sent = pointerWebSocket?.send("type:button\\nname:$name\\n\\n") ?: false
                  if (!sent) {
                      if (name == "HOME") sendRequest("btn_home", "ssap://system.launcher/open")
                  }
              }

              fun fetchInstalledApps() {
                  sendRequest("req_apps", "ssap://com.webos.applicationManager/listLaunchPoints")
              }

              private fun parseApps(payload: JSONObject) {
                  val array = payload.optJSONArray("launchPoints") ?: return
                  val list = mutableListOf<TvApp>()
                  for (i in 0 until array.length()) {
                      val item = array.getJSONObject(i)
                      list.add(TvApp(id = item.optString("id"), title = item.optString("title")))
                  }
                  _installedApps.value = list
              }

              fun launchApp(appId: String) =
                  sendRequest("launch_$appId", "ssap://system.launcher/launch", JSONObject().put("id", appId))

              fun volumeUp() = sendRequest("vol_up", "ssap://audio/volumeUp")
              fun volumeDown() = sendRequest("vol_down", "ssap://audio/volumeDown")

              fun toggleMute(muted: Boolean) {
                  _isMuted.value = muted
                  sendRequest("mute", "ssap://audio/setMute", JSONObject().put("mute", muted))
              }

              fun channelUp() = sendRequest("ch_up", "ssap://tv/channelUp")
              fun channelDown() = sendRequest("ch_down", "ssap://tv/channelDown")

              fun turnOff() {
                  sendRequest("power_off", "ssap://system/turnOff")
                  disconnect()
              }

              fun play() = sendRequest("play", "ssap://media.controls/play")
              fun pause() = sendRequest("pause", "ssap://media.controls/pause")

              fun showToast(message: String) =
                  sendRequest("toast", "ssap://system.notifications/createToast", JSONObject().put("message", message))

              private fun sendRequest(id: String, uri: String, payload: JSONObject? = null) {
                  val json = JSONObject().apply {
                      put("id", id)
                      put("type", "request")
                      put("uri", uri)
                      if (payload != null) put("payload", payload)
                  }
                  mainWebSocket?.send(json.toString())
              }

              fun disconnect() {
                  try {
                      pointerWebSocket?.close(1000, "Bye")
                      mainWebSocket?.close(1000, "Bye")
                  } catch (e: Exception) {}
                  pointerWebSocket = null
                  mainWebSocket = null
                  _connectionState.value = ConnectionState.DISCONNECTED
              }

              private fun createUnsafeOkHttpClient(): OkHttpClient {
                  val trustAll = arrayOf<TrustManager>(object : X509TrustManager {
                      override fun checkClientTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                      override fun checkServerTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                      override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
                  })
                  val ssl = SSLContext.getInstance("SSL").apply { init(null, trustAll, SecureRandom()) }
                  return OkHttpClient.Builder()
                      .sslSocketFactory(ssl.socketFactory, trustAll[0] as X509TrustManager)
                      .hostnameVerifier { _, _ -> true }
                      .connectTimeout(5, TimeUnit.SECONDS)
                      .readTimeout(0, TimeUnit.MILLISECONDS)
                      .build()
              }
          }
          """)

          w("app/src/main/java/com/example/lgremote/MainActivity.kt", """
